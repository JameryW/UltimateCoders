[package]
name = "uc-grpc-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "uc-grpc-server"
path = "src/main.rs"

[features]
# The gateway binary is the production deployment surface, so its default
# build must include the scheduler runtime. Keep `uc-engine`'s scheduler
# feature opt-in for library consumers, while ensuring the documented
# `cargo build -p uc-grpc-server` and Docker/launcher builds actually fire
# configured cron and one-shot jobs.
default = ["storage", "indexing", "messaging", "scheduler"]
storage = ["uc-engine/storage"]
indexing = ["uc-engine/indexing"]
messaging = ["uc-grpc/messaging", "async-nats"]
scheduler = ["uc-engine/scheduler"]

[dependencies]
uc-types = { path = "../uc-types" }
uc-engine = { path = "../uc-engine" }
uc-grpc = { path = "../uc-grpc", features = ["messaging"] }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true }
tonic-web = { workspace = true }
tonic-health = "0.12"
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
# `governance_boot` parses `UC_POLICY_GRANTS_JSON` (policy grants) from the
# environment; the binary owns that config surface, so it owns the parser dep.
serde_json = { workspace = true }
chrono = { workspace = true }
# async-nats is needed for start_scheduler's nats_client parameter (Option<async_nats::Client>).
# Feature-gated behind messaging (same as uc-grpc's async-nats).
async-nats = { workspace = true, optional = true }

[dev-dependencies]
chrono-tz = "0.10"
