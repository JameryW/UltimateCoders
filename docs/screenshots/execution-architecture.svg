<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d121c"/><stop offset="1" stop-color="#172833"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#79f29b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="78" y="84" fill="#79f29b" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" letter-spacing="5">ULTIMATECODERS · EXECUTION ARCHITECTURE</text>
  <text x="78" y="146" fill="#edf4ff" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="44" font-weight="700">一条任务，贯穿四层系统</text>
  <text x="78" y="187" fill="#a9b8cc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="20">交互层 → Gateway → Worker / Search / Memory → Task Events</text>

  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <rect x="78" y="252" width="250" height="190" rx="16" fill="#192130" stroke="#79f29b" stroke-width="2"/>
    <text x="108" y="291" fill="#79f29b" font-size="15" font-weight="700">01 · INTERACTION</text>
    <text x="108" y="333" fill="#f3f7ff" font-size="27" font-weight="700">OMP / TUI</text>
    <text x="108" y="368" fill="#a9b8cc" font-size="16">自然语言任务</text>
    <text x="108" y="395" fill="#a9b8cc" font-size="16">PTY · WebSocket · gRPC-Web</text>

    <rect x="430" y="212" width="310" height="270" rx="16" fill="#1b2735" stroke="#79f29b" stroke-width="2"/>
    <text x="462" y="251" fill="#79f29b" font-size="15" font-weight="700">02 · CONTROL PLANE</text>
    <text x="462" y="294" fill="#f3f7ff" font-size="27" font-weight="700">Rust Gateway</text>
    <text x="462" y="330" fill="#a9b8cc" font-size="16">TaskService · EngineService</text>
    <text x="462" y="358" fill="#a9b8cc" font-size="16">WorkerService · WatchTask</text>
    <text x="462" y="386" fill="#a9b8cc" font-size="16">DAG Scheduler · Event Broadcast</text>
    <rect x="462" y="420" width="186" height="28" rx="5" fill="#233b3c"/>
    <text x="476" y="440" fill="#bdebc8" font-family="ui-monospace,monospace" font-size="14">recoverable state</text>

    <rect x="842" y="172" width="300" height="190" rx="16" fill="#192130" stroke="#3d8090" stroke-width="2"/>
    <text x="872" y="211" fill="#79f29b" font-size="15" font-weight="700">03 · DISTRIBUTED EXECUTION</text>
    <text x="872" y="253" fill="#f3f7ff" font-size="27" font-weight="700">Worker Pool</text>
    <text x="872" y="288" fill="#a9b8cc" font-size="16">能力声明 · 心跳 · 负载</text>
    <text x="872" y="316" fill="#a9b8cc" font-size="16">Grok · Claude Code · Codex</text>

    <rect x="842" y="402" width="300" height="190" rx="16" fill="#192130" stroke="#3d8090" stroke-width="2"/>
    <text x="872" y="441" fill="#79f29b" font-size="15" font-weight="700">04 · KNOWLEDGE PLANE</text>
    <text x="872" y="483" fill="#f3f7ff" font-size="27" font-weight="700">Search + Memory</text>
    <text x="872" y="518" fill="#a9b8cc" font-size="16">Text · Semantic · AST</text>
    <text x="872" y="546" fill="#a9b8cc" font-size="16">TiKV · Qdrant · PostgreSQL</text>

    <rect x="1242" y="252" width="280" height="250" rx="16" fill="#192130" stroke="#79f29b" stroke-width="2"/>
    <text x="1272" y="291" fill="#79f29b" font-size="15" font-weight="700">05 · OBSERVABILITY</text>
    <text x="1272" y="333" fill="#f3f7ff" font-size="27" font-weight="700">Task Events</text>
    <text x="1272" y="370" fill="#a9b8cc" font-size="16">submitted → running</text>
    <text x="1272" y="398" fill="#a9b8cc" font-size="16">→ completed / failed</text>
    <text x="1272" y="426" fill="#a9b8cc" font-size="16">broadcast → TUI / API</text>

    <path d="M 328 347 L 430 347" stroke="#79f29b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 740 300 C 785 270, 800 266, 842 266" fill="none" stroke="#79f29b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 740 400 C 785 450, 800 500, 842 500" fill="none" stroke="#79f29b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 1142 266 L 1242 328" fill="none" stroke="#79f29b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 1142 500 L 1242 420" fill="none" stroke="#79f29b" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <rect x="78" y="680" width="1444" height="2" fill="#2d4352"/>
  <text x="78" y="728" fill="#79f29b" font-family="ui-monospace,monospace" font-size="17">ONE TASK</text>
  <text x="78" y="765" fill="#edf4ff" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24">意图被拆解，执行被调度，知识被复用，结果被持续观测。</text>
  <text x="1522" y="728" text-anchor="end" fill="#79f29b" font-family="ui-monospace,monospace" font-size="17">ADVANTAGES</text>
  <text x="1522" y="765" text-anchor="end" fill="#a9b8cc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18">Observable · Distributed · Recoverable · Model-agnostic</text>
</svg>
