  <rect x="32" y="470" width="556" height="230" rx="14" fill="#f0f8f6" stroke="#d8e9e4"/>
  <text x="56" y="510" font-size="25" class="heading" text-anchor="start">Planning &amp; control</text>
  <rect x="32" y="738" width="556" height="218" rx="14" fill="#f6f3fb" stroke="#e3dcf0"/>
  <text x="56" y="778" font-size="25" class="heading" text-anchor="start">Worker pool</text>
  <text x="56" y="258" font-size="24" class="heading" text-anchor="start">Web Dashboard</text>
  <text x="56" y="290" font-size="21" class="muted" text-anchor="start">React · gRPC-Web</text>
