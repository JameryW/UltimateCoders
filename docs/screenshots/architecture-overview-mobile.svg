<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1436" viewBox="0 0 620 1436" preserveAspectRatio="xMidYMid meet" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">UltimateCoders · System architecture</title>
  <desc id="desc">Overview of UltimateCoders: Dashboard and optional OMP submit tasks; Python plans DAGs and Rust owns task state and dispatch. NATS connects the control plane to scalable Workers in isolated Git worktrees. Shared services supply search, memory and models. Optional MetaInfer supplies specialized GPU tools, with UC acceptance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#60758c"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .heading { font-weight: 600; fill: #0f172a; }
      .section { font-weight: 600; letter-spacing: 1.5px; }
      .muted { fill: #64748b; }
      .connector { fill: none; stroke: #60758c; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="620" height="1436" fill="#ffffff"/>
  <text x="32" y="44" font-size="16" class="section muted" text-anchor="start">ULTIMATECODERS</text>
  <text x="32" y="94" font-size="36" class="heading" text-anchor="start">System architecture</text>
  <text x="32" y="132" font-size="21" class="muted" text-anchor="start">Python plans · Rust dispatches · Workers execute</text>
  <path d="M310 432 V470" class="connector" marker-end="url(#arrow)"/>
  <path d="M310 700 V738" class="connector" marker-end="url(#arrow)"/>
  <rect x="32" y="168" width="556" height="264" rx="14" fill="#f1f5fb" stroke="#dbe5f1"/>
