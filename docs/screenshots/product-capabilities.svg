<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d121c"/>
      <stop offset="1" stop-color="#152b31"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79f29b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#79f29b"/>
      <stop offset="1" stop-color="#79f29b" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="-30" r="310" fill="#2b796b" opacity=".11"/>
  <circle cx="1500" cy="80" r="170" fill="#79f29b" opacity=".06"/>
  <text x="78" y="82" fill="#79f29b" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" letter-spacing="5">ULTIMATECODERS · PRODUCT CAPABILITIES</text>
  <text x="78" y="148" fill="#edf4ff" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="46" font-weight="700">从自然语言任务到可观测的分布式执行</text>
  <text x="78" y="190" fill="#a9b8cc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="20">OMP 交互入口 · Rust Gateway 控制中枢 · Python Worker 执行层 · Hybrid Search + Layered Memory</text>
  <rect x="78" y="222" width="1444" height="2" fill="url(#line)"/>

  <g filter="url(#shadow)">
    <rect x="78" y="258" width="440" height="218" rx="18" fill="#192130" stroke="#344359"/>
    <rect x="550" y="258" width="440" height="218" rx="18" fill="#192130" stroke="#344359"/>
    <rect x="1022" y="258" width="500" height="218" rx="18" fill="#192130" stroke="#344359"/>
    <rect x="78" y="500" width="440" height="218" rx="18" fill="#192130" stroke="#344359"/>
    <rect x="550" y="500" width="440" height="218" rx="18" fill="#192130" stroke="#344359"/>
    <rect x="1022" y="500" width="500" height="218" rx="18" fill="#192130" stroke="#344359"/>
  </g>

  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <text x="108" y="296" fill="#79f29b" font-size="16" font-weight="700">01 / ORCHESTRATION</text>
    <text x="108" y="338" fill="#f3f7ff" font-size="27" font-weight="700">DAG 任务编排</text>
    <text x="108" y="374" fill="#a9b8cc" font-size="17">自然语言 → subtasks → 依赖分波次</text>
    <text x="108" y="404" fill="#a9b8cc" font-size="17">submitted / running / completed / failed</text>
    <rect x="108" y="430" width="215" height="27" rx="5" fill="#233448"/>
    <text x="122" y="449" fill="#bdebc8" font-family="ui-monospace,monospace" font-size="14">TaskService · Scheduler</text>

    <text x="580" y="296" fill="#79f29b" font-size="16" font-weight="700">02 / EXECUTION</text>
    <text x="580" y="338" fill="#f3f7ff" font-size="27" font-weight="700">能力感知 Worker</text>
    <text x="580" y="374" fill="#a9b8cc" font-size="17">注册 · 心跳 · 能力声明 · 负载匹配</text>
    <text x="580" y="404" fill="#a9b8cc" font-size="17">Grok Build · Claude Code · Codex</text>
    <rect x="580" y="430" width="190" height="27" rx="5" fill="#233448"/>
    <text x="594" y="449" fill="#bdebc8" font-family="ui-monospace,monospace" font-size="14">WorkerService · NATS</text>

    <text x="1052" y="296" fill="#79f29b" font-size="16" font-weight="700">03 / KNOWLEDGE</text>
    <text x="1052" y="338" fill="#f3f7ff" font-size="27" font-weight="700">Hybrid Search + Memory</text>
    <text x="1052" y="374" fill="#a9b8cc" font-size="17">Text + Semantic + AST 跨仓库检索</text>
    <text x="1052" y="404" fill="#a9b8cc" font-size="17">短期 KV · 长期向量 · 结构化元数据</text>
    <rect x="1052" y="430" width="255" height="27" rx="5" fill="#233448"/>
    <text x="1066" y="449" fill="#bdebc8" font-family="ui-monospace,monospace" font-size="14">TiKV · Qdrant · PostgreSQL</text>

    <text x="108" y="538" fill="#79f29b" font-size="16" font-weight="700">04 / INTERACTION</text>
    <text x="108" y="580" fill="#f3f7ff" font-size="27" font-weight="700">OMP 原生体验</text>
    <text x="108" y="616" fill="#a9b8cc" font-size="17">PTY 实时输出 · WebSocket · React TUI</text>
    <text x="108" y="646" fill="#a9b8cc" font-size="17">终端、命令层、Gateway 状态统一可见</text>
    <rect x="108" y="672" width="205" height="27" rx="5" fill="#233448"/>
    <text x="122" y="691" fill="#bdebc8" font-family="ui-monospace,monospace" font-size="14">OMP · WebSocket · gRPC-Web</text>

    <text x="580" y="538" fill="#79f29b" font-size="16" font-weight="700">05 / RELIABILITY</text>
    <text x="580" y="580" fill="#f3f7ff" font-size="27" font-weight="700">事件驱动、可恢复</text>
    <text x="580" y="616" fill="#a9b8cc" font-size="17">TaskEvent 广播 · WatchTask · checkpoint</text>
    <text x="580" y="646" fill="#a9b8cc" font-size="17">暂停 / 恢复 / 取消 / 本地 fallback</text>
    <rect x="580" y="672" width="205" height="27" rx="5" fill="#233448"/>
    <text x="594" y="691" fill="#bdebc8" font-family="ui-monospace,monospace" font-size="14">Broadcast · Checkpoint</text>

    <text x="1052" y="538" fill="#79f29b" font-size="16" font-weight="700">06 / DEPLOYMENT</text>
    <text x="1052" y="580" fill="#f3f7ff" font-size="27" font-weight="700">从单机到集群</text>
    <text x="1052" y="616" fill="#a9b8cc" font-size="17">本机 OMP · 容器 Gateway · Docker Compose</text>
    <text x="1052" y="646" fill="#a9b8cc" font-size="17">同一核心模型，按规模渐进式部署</text>
    <rect x="1052" y="672" width="200" height="27" rx="5" fill="#233448"/>
    <text x="1066" y="691" fill="#bdebc8" font-family="ui-monospace,monospace" font-size="14">Rust · Python · Docker</text>
  </g>
  <text x="78" y="816" fill="#79f29b" font-family="ui-monospace,monospace" font-size="16">BUILD → RUN → REMEMBER → SCALE</text>
  <text x="1522" y="816" text-anchor="end" fill="#8494aa" font-family="ui-monospace,monospace" font-size="15">observable by default</text>
</svg>
