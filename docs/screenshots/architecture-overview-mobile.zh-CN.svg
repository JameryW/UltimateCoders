<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1436" viewBox="0 0 620 1436" preserveAspectRatio="xMidYMid meet" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">UltimateCoders · 系统架构</title>
  <desc id="desc">UltimateCoders 概览：Dashboard 和可选 OMP 提交任务；Python 规划 DAG，Rust 管理任务状态与调度。NATS 连接控制层和隔离 worktree 中的可扩展 Worker。共享服务提供检索、记忆和模型；可选 MetaInfer 提供 GPU 工具，UC 负责验收。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#60758c"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .heading { font-weight: 600; fill: #0f172a; }
      .section { font-weight: 600; letter-spacing: 1.5px; }
      .muted { fill: #64748b; }
      .connector { fill: none; stroke: #60758c; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="620" height="1436" fill="#ffffff"/>
  <text x="32" y="44" font-size="16" class="section muted" text-anchor="start">ULTIMATECODERS</text>
  <text x="32" y="94" font-size="36" class="heading" text-anchor="start">系统架构</text>
  <text x="32" y="132" font-size="21" class="muted" text-anchor="start">Python 规划 · Rust 调度 · Worker 执行</text>
  <path d="M310 432 V470" class="connector" marker-end="url(#arrow)"/>
  <path d="M310 700 V738" class="connector" marker-end="url(#arrow)"/>
  <rect x="32" y="168" width="556" height="264" rx="14" fill="#f1f5fb" stroke="#dbe5f1"/>
  <text x="56" y="208" font-size="25" class="heading" text-anchor="start">交互入口</text>
  <rect x="32" y="470" width="556" height="230" rx="14" fill="#f0f8f6" stroke="#d8e9e4"/>
  <text x="56" y="510" font-size="25" class="heading" text-anchor="start">规划与控制</text>
  <rect x="32" y="738" width="556" height="218" rx="14" fill="#f6f3fb" stroke="#e3dcf0"/>
  <text x="56" y="778" font-size="25" class="heading" text-anchor="start">Worker 集群</text>
  <text x="56" y="258" font-size="24" class="heading" text-anchor="start">Web Dashboard</text>
  <text x="56" y="290" font-size="21" class="muted" text-anchor="start">React · gRPC-Web</text>
  <text x="56" y="334" font-size="24" class="heading" text-anchor="start">Dashboard API</text>
  <text x="56" y="366" font-size="21" class="muted" text-anchor="start">FastAPI · REST / SSE</text>
  <rect x="56" y="388" width="508" height="40" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="72" y="415" font-size="21" class="" text-anchor="start">OMP 终端 · 可选</text>
  <text x="56" y="560" font-size="24" class="heading" text-anchor="start">Python 规划器</text>
  <text x="56" y="592" font-size="21" class="muted" text-anchor="start">DAG · 领域路由</text>
  <text x="56" y="644" font-size="24" class="heading" text-anchor="start">Rust Gateway</text>
  <text x="56" y="676" font-size="21" class="muted" text-anchor="start">状态 · 调度 · 恢复</text>
