<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" preserveAspectRatio="xMidYMid meet" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">UltimateCoders · 系统架构</title>
  <desc id="desc">UltimateCoders 服务架构：Dashboard 和可选 OMP 连接 Rust Gateway；Dashboard API、Python 规划器通过 NATS 交换消息。Gateway 经 JetStream 派发就绪节点，Worker 经 gRPC 注册。共享服务提供检索、记忆、持久化和模型 API。可选 MetaInfer 生成推理候选，UC 负责基准测试、验收和回滚。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#60758c"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .heading { font-weight: 600; fill: #0f172a; }
      .section { font-weight: 600; letter-spacing: 1.5px; }
      .muted { fill: #64748b; }
      .connector { fill: none; stroke: #60758c; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
