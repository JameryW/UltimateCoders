<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" preserveAspectRatio="xMidYMid meet" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">UltimateCoders · System architecture</title>
  <desc id="desc">Service overview of UltimateCoders. Dashboard and optional OMP connect to the Rust Gateway; the Dashboard API and Python planner exchange messages through NATS. The Gateway dispatches ready nodes to Python Workers through JetStream; Workers register through gRPC. Shared services provide search, memory, persistence and model APIs. Optional MetaInfer produces inference candidates; UC benchmarks and accepts or rolls them back.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#60758c"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .heading { font-weight: 600; fill: #0f172a; }
      .section { font-weight: 600; letter-spacing: 1.5px; }
      .muted { fill: #64748b; }
      .connector { fill: none; stroke: #60758c; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
