name: Scripts CI

# The spec-reference guard lives in `scripts/`, which was in NO workflow's
# `paths` before this file existed (measured 2026-09-17, #675 slice C: zero of
# the four other workflows mention `scripts/`).  So a guard regression, or an
# exemption rule that quietly stopped matching, could ship with nothing
# noticing.
#
# Two deliberate choices, both measured rather than assumed:
#
#   * NO `paths` filter.  The obvious shape would be `paths: scripts/**`, but
#     that is semantically wrong: the guard walks the whole repository
#     (`os.walk(ROOT)`) to build its index, so adding a file can make an
#     exemption rule dead, and deleting one can create a dangling mention.
#     A `paths` filter would therefore be blind to exactly the changes that
#     flip a verdict.  The job is deliberately tiny (no Rust build, no matrix
#     over Python for the suite -- see below) so that running it on every push
#     stays cheap.
#   * `ruff` inside the two guard jobs is scoped to the NAMED files, not to
#     `scripts/`: each guard job also runs its guard and its tests, so its
#     greenness has to stay self-contained.  That shape used to be FORCED --
#     `ruff check scripts/` was red on two pre-existing issues in
#     check-codex-issue-flow.py (I001 + UP045, last touched fc9b5ce), which T26
#     declined to adopt and T34 / #684 paid off.  Retiring it also measured what
#     the shape cost: with a throwaway `scripts/*.py` carrying one F401, all
#     three named-file invocations in this repo stayed GREEN while `ruff check
#     scripts/` went red.  So a file ADDED to `scripts/` was linted by nothing
#     unless someone remembered to edit a workflow.  `scripts-lint` is the
#     umbrella that closes that gap -- the next guard added to `scripts/` is
#     linted from birth.  It lives here rather than in a workflow of its own
#     because `paths:` is workflow-level in Actions, not job-level: a correctly
#     filtered pure-lint workflow cannot share a file with `spec-refs` /
#     `tasks-refs`, which must NOT be filtered (they read an open input set).
#     `ruff format --check` is still not run at all: it fails on the guard both
#     before and after #675 slice C (verified against the `git show HEAD:`
#     copy), so wiring it would import a large unrelated reformat.
#   * `.trellis/scripts/**` and `.claude/hooks/**` stay outside every ruff
#     target, by REGISTRATION rather than by silence: `ci-trellis.yml`'s header
#     records the framework scripts (28 tracked `.py`, exactly 1 of them linted
#     there) and `.trellis/.template-hashes.json` the three hooks.
#
# The Python matrix keeps 3.9 because the guard claims 3.9 compatibility (it
# leans on `from __future__ import annotations` and avoids 3.10+ runtime
# syntax) and the repo's Python CI matrix includes 3.9.  Exercising the claim
# here is what stops it from silently becoming false.
#
# `tasks-refs` was added 2026-09-18 (#680, the C half of #678's "A + C").  It is
# a SEPARATE JOB rather than more steps on `spec-refs`: the two guards share
# nothing but a shape, and a red one should name which surface broke.  It is
# wired WITHOUT a `paths` filter for the same reason as `spec-refs` -- it reads
# an open input set (any archived task directory, or any file a task cites, can
# flip its verdict).  Note the index source differs from `spec-refs`: this guard
# uses `git ls-files` rather than `os.walk`, so a gitignored file can no longer
# change the verdict (the T26 two-verdicts-for-one-commit defect).
#
# This job IS expected to be red while #680's residual 14 dangling / 47
# malformed citations stand -- those are recorded in #680 and are deliberately
# outside the guard ticket's scope.  A red run here means the guard is telling
# the truth, not that the guard is broken; fix the citation or fix #680.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-refs:
    name: spec reference guard (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: pip install ruff pytest
      - name: ruff check (the guard and its test only)
        run: ruff check scripts/check-spec-refs.py tests/python/test_check_spec_refs.py
      - name: run the guard
        # Advisory by design -- a mention is not a reference, so this never fails
        # on the dangling count.  It is here so the run explains itself.
        run: python scripts/check-spec-refs.py --audit
      - name: synthetic corpus + real corpus tests
        # `-o addopts=""`: pyproject's addopts pull in pytest-cov, which this job
        # has no use for -- the test loads a script by path and never imports the
        # package, so coverage would only report 0%.
        run: pytest tests/python/test_check_spec_refs.py -v -o addopts=""

  tasks-refs:
    name: task context reference guard (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: pip install ruff pytest
      - name: ruff check (the guard, its test, and the self-check)
        run: >-
          ruff check scripts/check-tasks-refs.py
          scripts/check-tasks-refs-selftest.py
          tests/python/test_check_tasks_refs.py
      - name: run the guard
        # NOT advisory: a dangling citation is repairable, and #678 already
        # shipped the self-healing path -- so this failing is actionable.  No
        # whitelist: an allow-list would be "turning the red off" instead of
        # fixing it, and the residue is already recorded in #680.
        run: python scripts/check-tasks-refs.py --audit
      - name: synthetic repo + real corpus tests
        run: pytest tests/python/test_check_tasks_refs.py -v -o addopts=""
      - name: mutation self-check
        # A checker nobody has seen go red is not evidence, so the procedure
        # that falsifies this guard is a CI step and not a local ritual: six
        # mutations, each must redden, no two may redden an identical set, and
        # the restore is certified by a separate process.
        run: python scripts/check-tasks-refs-selftest.py

  scripts-lint:
    name: ruff lint (the whole scripts/ directory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check scripts/
        # Directory-wide ON PURPOSE -- see the header.  The named-file steps in
        # the two jobs above are measurably blind to a file that has just been
        # ADDED to `scripts/`; this one is not.
        run: ruff check scripts/
