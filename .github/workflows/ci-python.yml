name: Python CI

# WHY THIS WORKFLOW IS TRIGGERED BY `crates/**` (T36 / #686)
# ----------------------------------------------------------
# The `test` job builds the Rust extension before running pytest:
#
#     maturin develop --release --manifest-path crates/uc-python/Cargo.toml
#
# `crates/uc-python` depends on `uc-types`, `uc-engine` (features storage + indexing)
# and `uc-grpc`, so that single command compiles four crates plus the workspace root
# manifests. Those Rust sources are therefore inputs of this workflow: a change to any
# of them changes the extension the Python tests exercise. Before this ticket the
# `paths` list carried no `crates/**` entry at all, so a Rust-only push ran Rust CI and
# left the Python half of the engine unchecked -- a gate that cannot fire for its own
# inputs looks exactly like a gate that passes.
#
# Measured 2026-09-19 over the real push history of `main` (300 runs / 219 push heads;
# each push's file set = `git diff --name-only <previous push head>..<head>`; ground
# truth = whether the runs API reports a Python CI run for that head):
#   * the matcher reproduces GitHub's own verdict exactly -- the old `paths` matched
#     65/218 pushes and the API shows Python CI ran for 65/218;
#   * 43/218 pushes changed the extension's dependency closure while the old `paths`
#     matched none of them, and Python CI ran for 0 of those 43;
#   * every one of the 65 pushes that did run still matches the widened list (no loss).
#
# WHY THE DEPENDENCY CLOSURE AND NOT `crates/**`
# ---------------------------------------------
# `crates/uc-grpc-server` is not a dependency of `uc-python` (it is a separate binary
# crate), so it is deliberately absent here: listing it would trigger this workflow for
# changes that cannot affect the extension. The list above is derived from
# `crates/uc-python/Cargo.toml`'s `[dependencies]`, not guessed.
#
# MAINTENANCE RULE: when `crates/uc-python/Cargo.toml` gains a crate dependency that
# lives under `crates/`, add it to both `paths` lists in the same change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci-python.yml"
      - "dashboard/**"
      # the extension this job compiles -- see the header note above
      - "crates/uc-python/**"
      - "crates/uc-types/**"
      - "crates/uc-engine/**"
      - "crates/uc-grpc/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci-python.yml"
      - "dashboard/**"
      # the extension this job compiles -- see the header note above
      - "crates/uc-python/**"
      - "crates/uc-types/**"
      - "crates/uc-engine/**"
      - "crates/uc-grpc/**"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pyyaml
      - run: ruff check python/ tests/

  # ponytail: dashboard lint + import check
  dashboard:
    name: dashboard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Dashboard imports the runtime stack directly; install the same
      # dependencies declared by pyproject instead of relying on the runner.
      - run: pip install ruff fastapi uvicorn jinja2 sse-starlette nats-py httpx
      - run: ruff check python/ultimate_coders/dashboard/
      - name: Import check
        run: PYTHONPATH=python python -c "from ultimate_coders.dashboard.app import DashboardApp; print('dashboard import OK')"

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      # Tests use PYTHONPATH=python, so the project itself is not installed and
      # its base runtime dependencies must be explicit here.
      - run: pip install pytest pytest-asyncio pytest-cov pyyaml maturin httpx anthropic litellm fastapi uvicorn jinja2 sse-starlette nats-py prometheus-client
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build Rust extension
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio pytest-cov pyyaml httpx anthropic litellm prometheus-client fastapi uvicorn jinja2 sse-starlette nats-py
          maturin develop --release --manifest-path crates/uc-python/Cargo.toml
      - name: Run tests
        run: |
          source .venv/bin/activate
          PYTHONPATH=python pytest tests/python/ -v
      # The dispatch plane's other tests mock `js.add_consumer`, which is the
      # one call a broker can refuse — and a work-queue stream refuses two
      # shapes that look fine in a mock (a second unfiltered consumer, and a
      # filtered consumer overlapping an existing one). T12 shipped inert
      # because of exactly that, so run the live-broker file against a real
      # JetStream server. It skips if the broker is missing rather than
      # failing, but a broken download or a server that will not start is a
      # loud step failure on purpose.
      - name: Live NATS dispatch tests
        if: matrix.python-version == '3.12'
        run: |
          source .venv/bin/activate
          curl -sSL -o /tmp/nats.tar.gz \
            https://github.com/nats-io/nats-server/releases/download/v2.14.6/nats-server-v2.14.6-linux-amd64.tar.gz
          tar xzf /tmp/nats.tar.gz -C /tmp
          # `-m` is required: the HTTP monitoring endpoint is off by default,
          # so without it the readiness probe below polls a closed port for
          # its full budget and the step proceeds on an unverified broker.
          /tmp/nats-server-v2.14.6-linux-amd64/nats-server -js -sd /tmp/nats-js -p 4222 -m 8222 > /tmp/nats.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8222/jsz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8222/jsz > /dev/null || {
            echo "JetStream did not come up; server log follows"
            cat /tmp/nats.log
            exit 1
          }
          PYTHONPATH=python pytest tests/python/test_nats_live_dispatch.py --integration -v
