name: publish-uc-images

# 一次性发布镜像到 GHCR：worker(base) / gateway / dashboard-api / dashboard-ui
on:
  push:
    branches: [ci/publish-uc-images]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: jameryw

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/uc-worker:latest
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.grpc
          push: true
          tags: ghcr.io/${{ env.OWNER }}/uc-gateway:latest

  dashboard-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: true
          tags: ghcr.io/${{ env.OWNER }}/uc-dashboard:latest

  dashboard-api:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull worker base as build context
        run: docker pull ghcr.io/${{ env.OWNER }}/uc-worker:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dashboard-api
          push: true
          tags: ghcr.io/${{ env.OWNER }}/uc-dashboard-api:latest
          build-contexts: |
            base_image=docker-image://ghcr.io/${{ env.OWNER }}/uc-worker:latest
