name: Dashboard CI

# Triggered by the dashboard, the Rust proto its gRPC stubs are generated from,
# and both generated trees: a proto-only change must re-run the staleness check
# below, and leaving the proto out is how the checked-in stub fell weeks behind.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "crates/uc-grpc/proto/**"
      - "packages/uc-orchestrator/**"
      - "buf.gen.yaml"
      - "buf.yaml"
      - ".github/workflows/ci-dashboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - "crates/uc-grpc/proto/**"
      - "packages/uc-orchestrator/**"
      - "buf.gen.yaml"
      - "buf.yaml"
      - ".github/workflows/ci-dashboard.yml"

jobs:
  typecheck:
    name: typecheck (app + node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      # The two gRPC stubs are generated: `dashboard/src/grpc/engine_pb.ts` from
      # the root `buf.gen.yaml`, `packages/uc-orchestrator/src/grpc/engine_pb.ts`
      # from the orchestrator's own (it needs `import_extension=js`). Regenerate
      # here and fail on any working-tree change, so drift is caught by CI
      # instead of by a reviewer noticing a stale field.
      - name: Regenerate gRPC stubs
        run: |
          npm run generate
          cd ../packages/uc-orchestrator
          PATH="$PWD/../../dashboard/node_modules/.bin:$PATH" buf generate
      - name: Generated stubs are current
        run: |
          # This job's working directory is `dashboard`; git pathspecs are
          # relative to it, so step out before naming repo-root paths.
          cd ..
          changed=$(git status --porcelain -- dashboard/src/grpc packages/uc-orchestrator/src/grpc)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- dashboard/src/grpc packages/uc-orchestrator/src/grpc | head -200
            echo "::error::generated gRPC stubs are stale; run 'pnpm --dir dashboard run generate' and regenerate packages/uc-orchestrator/src/grpc"
            exit 1
          fi
      # Root tsconfig.json is a project-references shell (files:[] + references);
      # a bare `tsc --noEmit` silently skips the referenced projects' src and
      # exits 0 even on real type errors. Check each referenced project directly.
      - run: |
          pnpm exec tsc -p tsconfig.app.json --noEmit
          pnpm exec tsc -p tsconfig.node.json --noEmit

  build:
    name: vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build

  tests:
    # The .test.mjs suite is real coverage (lib ordering/parsing and SSR
    # render checks) and had no CI job at all -- a test that never runs is
    # not evidence. Node 22 because the tests import .ts sources directly
    # (type stripping); Node 20 cannot.
    name: node test (lib + SSR render)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
