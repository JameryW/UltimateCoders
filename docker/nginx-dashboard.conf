server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve backend service names at request time. This keeps the UI image
    # runnable on its own (showing the frontend offline state) while still
    # allowing Docker Compose to provide `orchestrator` and `gateway`.
    resolver 127.0.0.11 valid=30s;
    set $orchestrator_upstream http://orchestrator:8080;
    set $gateway_upstream http://gateway:50051;

    # SPA fallback — any non-file route serves index.html so the React
    # router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits `crossorigin` on production CSS/JS tags. The assets are
    # public static files, so explicitly allow the browser's CORS-mode fetch
    # instead of letting the stylesheet silently fail in the standalone UI.
    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Dashboard REST API + SSE stream → FastAPI backend (orchestrator).
    # SSE needs buffering disabled and long timeouts so events stream live.
    location /dashboard/api/ {
        proxy_pass $orchestrator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # TUI WebSocket → FastAPI backend
    location /ws/tui {
        proxy_pass $orchestrator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # gRPC-Web → gateway (tonic-web)
    location /ultimate_coders. {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # WatchTask/WatchDashboard are server streams and may be idle while
        # the cluster has no events. Keep the browser stream alive instead of
        # letting nginx close it after its default ~60s read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
