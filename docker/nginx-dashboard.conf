server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any non-file route serves index.html so the React
    # router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard REST API + SSE stream → FastAPI backend (orchestrator).
    # SSE needs buffering disabled and long timeouts so events stream live.
    location /dashboard/api/ {
        proxy_pass http://orchestrator:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # TUI WebSocket → FastAPI backend
    location /ws/tui {
        proxy_pass http://orchestrator:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # gRPC-Web → gateway (tonic-web)
    location /ultimate_coders. {
        proxy_pass http://gateway:50051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
